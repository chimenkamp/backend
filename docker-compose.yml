version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      CONFERIA_DB_PATH: /app/instance/conferia
      CONFERIA_DB_USERNAME: ${CONFERIA_DB_USERNAME:-sa}
      CONFERIA_DB_PASSWORD: ${CONFERIA_DB_PASSWORD:-}
      CONFERIA_UPLOAD_DIR: /app/instance/uploads
      CONFERIA_SETUP_TOKEN: ${CONFERIA_SETUP_TOKEN}
      CONFERIA_JWT_SECRET: ${CONFERIA_JWT_SECRET}
      CONFERIA_CORS_ALLOWED_ORIGINS: ${CONFERIA_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CONFERIA_BASE_URL: ${CONFERIA_BASE_URL:-http://localhost:8080}
      CONFERIA_FRONTEND_URL: ${CONFERIA_FRONTEND_URL:-http://localhost:5173}
      CONFERIA_MAIL_HOST: ${CONFERIA_MAIL_HOST:-localhost}
      CONFERIA_MAIL_PORT: ${CONFERIA_MAIL_PORT:-1025}
      CONFERIA_MAIL_FROM: ${CONFERIA_MAIL_FROM:-}
      CONFERIA_MAIL_USERNAME: ${CONFERIA_MAIL_USERNAME:-}
      CONFERIA_MAIL_PASSWORD: ${CONFERIA_MAIL_PASSWORD:-}
      CONFERIA_MAIL_AUTH: ${CONFERIA_MAIL_AUTH:-false}
      CONFERIA_MAIL_STARTTLS: ${CONFERIA_MAIL_STARTTLS:-false}
    volumes:
      - ./instance:/app/instance
