spring.application.name=conferia

# The base path has no extension. H2 creates <base-path>.mv.db.
spring.datasource.url=jdbc:h2:file:${CONFERIA_DB_PATH:./instance/conferia}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${CONFERIA_DB_USERNAME:sa}
spring.datasource.password=${CONFERIA_DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

conferia.setup-token=${CONFERIA_SETUP_TOKEN:}
conferia.jwt-secret=${CONFERIA_JWT_SECRET:}
conferia.cors.allowed-origins=${CONFERIA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
conferia.frontend-url=${CONFERIA_FRONTEND_URL:http://localhost:5173}
conferia.mail-from=${CONFERIA_MAIL_FROM:}
conferia.reminders.public-key=${CONFERIA_VAPID_PUBLIC_KEY:}
conferia.reminders.private-key=${CONFERIA_VAPID_PRIVATE_KEY:}
conferia.reminders.subject=${CONFERIA_VAPID_SUBJECT:}
conferia.reminders.minutes-before=${CONFERIA_REMINDER_MINUTES:15}
conferia.reminders.poll-ms=${CONFERIA_REMINDER_POLL_MS:30000}

spring.mail.host=${CONFERIA_MAIL_HOST:localhost}
spring.mail.port=${CONFERIA_MAIL_PORT:1025}
spring.mail.username=${CONFERIA_MAIL_USERNAME:}
spring.mail.password=${CONFERIA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${CONFERIA_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${CONFERIA_MAIL_STARTTLS:false}

file.upload-dir=${CONFERIA_UPLOAD_DIR:./instance/uploads}
app.base-url=${CONFERIA_BASE_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=${CONFERIA_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${CONFERIA_MAX_REQUEST_SIZE:10MB}

server.port=${PORT:8080}

spring.h2.console.enabled=${CONFERIA_H2_CONSOLE:false}
spring.h2.console.path=/h2-console
